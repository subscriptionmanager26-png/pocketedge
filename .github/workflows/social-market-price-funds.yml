name: Social market price refresh (funds)

# DISABLED — AMFI fund NAVs are edge-owned (refresh-fund-navs).
# Do not re-enable while validating the edge pipeline.

on:
  workflow_dispatch:
    inputs:
      history_date:
        description: 'Optional historical AMFI date to backfill (YYYY-MM-DD)'
        required: false
        type: string

concurrency:
  group: social-market-price-funds
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  refresh:
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Refresh mutual fund NAVs — disabled
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -n "${{ inputs.history_date }}" ]; then
            node scripts/refresh-social-market-prices.mjs --mode=fund-history --fund-history-date="${{ inputs.history_date }}"
          else
            node scripts/refresh-social-market-prices.mjs --mode=funds
          fi
