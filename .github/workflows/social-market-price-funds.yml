name: Social market price refresh (funds)

# Daily AMFI NAV sync into social_market_assets + social_market_price_history.
# Primary clock: Vercel Cron → workflow_dispatch (GH schedule is fallback).

on:
  schedule:
    # 10:00 PM IST — NAVs are usually published by then.
    - cron: '30 16 * * *'
  workflow_dispatch:
    inputs:
      history_date:
        description: 'Optional historical AMFI date to backfill (YYYY-MM-DD)'
        required: false
        type: string

concurrency:
  group: social-market-price-funds
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Refresh mutual fund NAVs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -n "${{ inputs.history_date }}" ]; then
            node scripts/refresh-social-market-prices.mjs --mode=fund-history --fund-history-date="${{ inputs.history_date }}"
          else
            node scripts/refresh-social-market-prices.mjs --mode=funds
          fi
