name: Social market price refresh (funds)

# Daily AMFI NAV sync into social_market_assets + social_market_price_history.
# Primary clock: Supabase pg_cron → dispatch-github-workflow (on-time).
# GH schedule below is a fallback if Supabase dispatch misses.

on:
  schedule:
    # Every 10 min from 21:30–23:30 IST (16:00–18:00 UTC).
    - cron: '*/10 16-17 * * *'
    - cron: '0 18 * * *'
  workflow_dispatch:
    inputs:
      history_date:
        description: 'Optional historical AMFI date to backfill (YYYY-MM-DD)'
        required: false
        type: string

concurrency:
  group: social-market-price-funds
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Refresh mutual fund NAVs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -n "${{ inputs.history_date }}" ]; then
            node scripts/refresh-social-market-prices.mjs --mode=fund-history --fund-history-date="${{ inputs.history_date }}"
          else
            node scripts/refresh-social-market-prices.mjs --mode=funds
          fi
