name: Test OpenAI stock market explanations

on:
  workflow_dispatch:

concurrency:
  group: test-openai-stock-explanations
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Generate GPT-5 Nano test explanations
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          STOCK_NEWS_SUPABASE_URL: ${{ secrets.STOCK_NEWS_SUPABASE_URL }}
          STOCK_NEWS_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STOCK_NEWS_SUPABASE_SERVICE_ROLE_KEY }}
          NEWS_GITHUB_API_URL: https://api.github.com/repos/subscriptionmanager26-png/nifty-total-market-news/contents/data/stories.jsonl
          NIFTY_NEWS_REPO_TOKEN: ${{ secrets.NIFTY_NEWS_REPO_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5-nano
        run: >-
          node scripts/generate-daily-stock-explanations.mjs
          --provider=openai
          --tickers=360ONE,ABB,ABCAPITAL,ACMESOLAR,ADANIENSOL,ADANIENT,ADANIGREEN,ADANIPORTS,ADANIPOWER,AEQUS,AETHER,ALKEM,ALOKINDS,AMBER,ANANDRATHI,ANGELONE,ANURAS,APLLTD,APOLLO,APOLLOTYRE
