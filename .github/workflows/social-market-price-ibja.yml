name: Social market price refresh (IBJA gold)

# IBJA Fine Gold (999) ₹/g into social_market_assets for SGB premium/discount.
# Primary clock: Supabase pg_cron → workflow_dispatch hourly 10:00–19:00 IST.
# GH schedule is a fallback.

on:
  schedule:
    # 10:00–19:00 IST = 04:30–13:30 UTC → minute 30, hours 4–13 UTC (10 runs/day)
    - cron: '30 4-13 * * *'
  workflow_dispatch:

concurrency:
  group: social-market-price-ibja
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Refresh IBJA Fine Gold (999)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/refresh-social-market-prices.mjs --mode=ibja
