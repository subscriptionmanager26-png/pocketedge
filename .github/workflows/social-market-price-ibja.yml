name: Social market price refresh (IBJA gold)

# DISABLED — IBJA is edge-owned (refresh-ibja-prices).
# Do not re-enable while validating the edge pipeline.

on:
  workflow_dispatch:

concurrency:
  group: social-market-price-ibja
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  refresh:
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Refresh IBJA Fine Gold (999) — disabled
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/refresh-social-market-prices.mjs --mode=ibja
