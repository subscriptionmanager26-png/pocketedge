name: Refresh AMC ETF iNAV

# Scrape AMC indicative NAVs into social_market_assets.amc_inav.
# Primary clock: Supabase pg_cron → workflow_dispatch every minute in NSE session.
# GH schedule is a coarse fallback.

on:
  schedule:
    # Every 5 min during NSE cash session (≈ 09:15–15:30 IST = 03:45–10:00 UTC)
    - cron: '*/5 4-10 * * 1-5'
  workflow_dispatch:

concurrency:
  group: refresh-amc-etf-inav
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/lib/amc-etf-inav/requirements.txt

      - name: Install scrape deps
        run: pip install -r scripts/lib/amc-etf-inav/requirements.txt

      - name: Scrape AMC iNAV and upsert
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python3 scripts/refresh-amc-etf-inav.py
