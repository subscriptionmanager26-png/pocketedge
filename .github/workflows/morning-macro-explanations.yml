name: Morning macro market explanations

on:
  # Scheduled via Vercel Cron → /api/cron/dispatch-github/macro-explanations
  # (GHA native schedule is unreliable; do not re-add schedule: here)
  workflow_dispatch:
    inputs:
      tickers:
        description: "Optional comma-separated tickers for a test run (empty = all eligible index/commodity/economics)"
        required: false
        default: ""

concurrency:
  group: morning-macro-explanations
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    # ~170 index/commodity/economics tickers / 4 keys × ~6s ≈ 5–10 min
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Generate morning index / commodity / economics digests
        env:
          STOCK_NEWS_SUPABASE_URL: ${{ secrets.STOCK_NEWS_SUPABASE_URL }}
          STOCK_NEWS_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STOCK_NEWS_SUPABASE_SERVICE_ROLE_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          MISTRAL_API_KEY_2: ${{ secrets.MISTRAL_API_KEY_2 }}
          MISTRAL_API_KEY_3: ${{ secrets.MISTRAL_API_KEY_3 }}
          MISTRAL_API_KEY_4: ${{ secrets.MISTRAL_API_KEY_4 }}
          MISTRAL_MODEL: mistral-small-latest
          TICKERS: ${{ github.event.inputs.tickers }}
        run: |
          ARGS=(
            --mode=macro
            --asset-types=index,commodity,economics
            --news-window-hours=36
            --max-bullets=4
          )
          if [ -n "$TICKERS" ]; then
            ARGS+=(--tickers="$TICKERS")
          fi
          node scripts/generate-daily-stock-explanations.mjs "${ARGS[@]}"
