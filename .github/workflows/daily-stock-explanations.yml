name: Daily stock market explanations

on:
  schedule:
    # 16:00 IST, Monday–Friday (10:30 UTC)
    - cron: '30 10 * * 1-5'
  workflow_dispatch:

concurrency:
  group: daily-stock-explanations
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    # At two seconds per Mistral request, a high-news day can exceed an hour.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Generate daily explanations
        env:
          # PocketEdge market-price database
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Stock-news database
          STOCK_NEWS_SUPABASE_URL: ${{ secrets.STOCK_NEWS_SUPABASE_URL }}
          STOCK_NEWS_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STOCK_NEWS_SUPABASE_SERVICE_ROLE_KEY }}
          # Public JSONL source; override only if the GitHub data path changes.
          NEWS_GITHUB_RAW_URL: https://raw.githubusercontent.com/subscriptionmanager26-png/nifty-total-market-news/main/data/stories.jsonl
          # Mistral
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          MISTRAL_MODEL: mistral-small-latest
        run: node scripts/generate-daily-stock-explanations.mjs
