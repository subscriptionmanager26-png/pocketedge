name: Daily stock market explanations

on:
  # Scheduled via Vercel Cron → /api/cron/dispatch-github/stock-explanations
  # (GHA native schedule is unreliable; do not re-add schedule: here)
  workflow_dispatch:

concurrency:
  group: daily-stock-explanations
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    # ~550 EQ tickers with recent news × 2s Mistral ≈ 20 min; headroom for retries.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Generate daily explanations
        env:
          # PocketEdge market-price database
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Stock-news database
          STOCK_NEWS_SUPABASE_URL: ${{ secrets.STOCK_NEWS_SUPABASE_URL }}
          STOCK_NEWS_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STOCK_NEWS_SUPABASE_SERVICE_ROLE_KEY }}
          # Mistral
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          MISTRAL_MODEL: mistral-small-latest
        run: node scripts/generate-daily-stock-explanations.mjs
