name: Social market price refresh (commodities)

# MCX WAF blocks Supabase edge + Vercel serverless (403 Access Denied).
# Native GH schedule needs no GITHUB_DISPATCH_TOKEN (unlike workflow_dispatch).

on:
  schedule:
    # Hourly during MCX session (≈09:00–23:30 IST = 03:30–18:00 UTC)
    - cron: '0 4-18 * * 1-5'
    # EOD ~00:15 IST
    - cron: '45 18 * * 1-5'
  workflow_dispatch:

concurrency:
  group: social-market-price-commodities
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Refresh commodity spots
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/refresh-social-market-prices.mjs --mode=commodities
