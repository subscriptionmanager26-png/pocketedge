name: Social market price refresh (commodities)

# Remains on GitHub: MCX blocks Supabase edge egress (403).
# Dispatched by pg_cron → dispatch-github-workflow (hourly + EOD).

on:
  workflow_dispatch:

concurrency:
  group: social-market-price-commodities
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Refresh commodity spots
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/refresh-social-market-prices.mjs --mode=commodities
