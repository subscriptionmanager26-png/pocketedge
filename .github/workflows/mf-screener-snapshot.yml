name: Refresh MF screener snapshot

# Monthly Upvaly + AMFI refresh for /resources/mf-screener.
# Mirrors wealth-web's screener-snapshot workflow.

on:
  schedule:
    # 3rd of each month at 03:00 UTC
    - cron: '0 3 3 * *'
  workflow_dispatch:

concurrency:
  group: mf-screener-snapshot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    # ~580 funds × 550ms ≈ 6 min; allow headroom for rate-limit retries
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch AMFI equity Direct Growth schemes
        run: npm run fetch:amfi-equity-direct-growth

      - name: Fetch Upvaly screener snapshot
        run: npm run fetch:mf-screener-snapshot

      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            public/data/screener/amfi-equity-direct-growth.json \
            public/data/screener/screener-snapshot.json \
            public/data/screener/screener-snapshot-meta.json
          if git diff --staged --quiet; then
            echo "No screener snapshot changes"
            exit 0
          fi
          git commit -m "chore(screener): refresh monthly Upvaly snapshot"
          git push
