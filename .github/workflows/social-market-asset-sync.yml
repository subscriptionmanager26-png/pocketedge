name: Social market asset identity sync

on:
  schedule:
    - cron: '30 2 * * 0'
  workflow_dispatch:

concurrency:
  group: social-market-asset-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Supabase client
        run: npm install @supabase/supabase-js@^2.49.1 --no-save --no-audit --no-fund
      - name: Sync security ISIN identities
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/sync-social-market-assets.mjs
