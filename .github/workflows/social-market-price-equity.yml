name: Social market price refresh (equity)

# DISABLED for automatic / backup use.
# Intraday + EOD equity LTP/history is edge-owned:
#   refresh-equity-prices / refresh-bse-prices / refresh-sgb-prices
# Keep this file only for a true emergency; do not re-enable schedules
# while validating the edge pipeline.

on:
  workflow_dispatch:

concurrency:
  group: social-market-price-equity
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  refresh:
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Refresh equity quotes (emergency only — currently disabled)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/refresh-social-market-prices.mjs --mode=equity
