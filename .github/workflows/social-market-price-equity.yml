name: Social market price refresh (equity)

# EOD history stamp for equity (NSE/BSE/SGB already live via Supabase edge).
# Intraday LTP:
#   - refresh-equity-prices (NSE stocks/ETFs, 15s)
#   - refresh-bse-prices (BSE fallback, 60s)
#   - refresh-sgb-prices (SGB, 60s)
# This workflow only runs post-close (and manual dispatch) with writeHistory.

on:
  schedule:
    # Post-close snapshot ~15:45 IST = 10:15 UTC weekdays
    - cron: '15 10 * * 1-5'
  workflow_dispatch:

concurrency:
  group: social-market-price-equity
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Refresh equity quotes (EOD history)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/refresh-social-market-prices.mjs --mode=equity
