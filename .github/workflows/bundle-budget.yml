name: Bundle budget

on:
  pull_request:
    paths:
      - 'src/**'
      - 'package.json'
      - 'vite.config.js'
      - 'scripts/check-bundle-budget.mjs'
  push:
    branches:
      - main

jobs:
  bundle-budget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run check:bundle
