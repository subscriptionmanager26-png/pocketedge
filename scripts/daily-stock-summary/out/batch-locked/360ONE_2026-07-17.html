<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Daily Stock Summary</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    /* Locked to reference canvas 1024×1536 — do not change for batch runs */
    :root {
      --bg: #ffffff;
      --card: #ffffff;
      --ink: #0a0a0a;
      --muted: #8a8a8a;
      --muted-2: #a3a3a3;
      --orange: #e83828;
      --orange-hl: #ff5238;
      --red: #e11d2e;
      --green: #16a34a;
      --shadow: 0 8px 28px rgba(15, 23, 42, 0.08);
      --radius: 22px;
      --pad: 30px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Inter, system-ui, -apple-system, sans-serif;
      background: #ffffff;
      margin: 0;
      width: 1024px;
      height: 1536px;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }
    #stage {
      width: 1024px;
      height: 1536px;
      background: var(--bg);
      padding: 26px var(--pad) 18px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      position: relative;
      overflow: hidden;
    }

    /* —— Header —— */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      flex-shrink: 0;
      padding-top: 6px;
    }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand-mark { width: 40px; height: 40px; flex-shrink: 0; }
    .brand-name {
      font-size: 30px; font-weight: 700;
      letter-spacing: -0.03em; color: #0a0a0a;
    }
    .header-right { text-align: right; }
    .header-label {
      font-size: 11px; font-weight: 500;
      letter-spacing: 0.22em; color: #7a7a7a;
      text-transform: uppercase;
    }
    .header-date {
      margin-top: 7px;
      display: inline-flex; align-items: center; gap: 8px;
      font-size: 15px; font-weight: 500; color: var(--ink);
    }
    .header-date .cal { width: 17px; height: 15px; }

    /* —— Hero —— */
    .hero {
      display: grid;
      grid-template-columns: 188px minmax(0, 1fr) 240px;
      gap: 18px;
      align-items: center;
      flex-shrink: 0;
      margin-top: 4px;
    }
    .logo-card {
      width: 188px; height: 188px;
      background: var(--card);
      border-radius: 24px;
      box-shadow: var(--shadow);
      display: grid; place-items: center;
      padding: 20px;
    }
    .logo-card img { max-width: 148px; max-height: 72px; object-fit: contain; }

    .identity {
      display: flex; flex-direction: column; gap: 14px;
      min-width: 0; padding-left: 2px;
    }
    .company-name {
      font-size: 50px; font-weight: 700; color: var(--ink);
      letter-spacing: -0.045em; line-height: 0.95;
    }
    .company-name .thin { font-weight: 500; }
    .sector-pill {
      align-self: flex-start;
      display: inline-flex; align-items: center; gap: 7px;
      background: #fff3eb;
      border-radius: 999px;
      padding: 8px 14px 8px 10px;
      font-size: 14px; font-weight: 500; color: #1a1a1a;
    }
    .sector-pill .ic {
      width: 22px; height: 22px; border-radius: 50%;
      background: #ffe4d4;
      display: grid; place-items: center; color: #9a3412;
    }

    .move-card {
      width: 240px; height: 188px;
      background: linear-gradient(180deg, #fff4f4 0%, #ffffff 58%);
      border: 1px solid #f7d4d4;
      border-radius: 24px;
      box-shadow: var(--shadow);
      padding: 20px 18px 14px;
      display: flex; flex-direction: column;
      overflow: hidden;
    }
    .move-card.is-up {
      background: linear-gradient(180deg, #ecfdf5 0%, #ffffff 58%);
      border-color: #bbf7d0;
    }
    .move-pct {
      font-size: 46px; font-weight: 800;
      color: var(--red); letter-spacing: -0.04em; line-height: 1;
      white-space: nowrap;
    }
    .move-card.is-up .move-pct { color: var(--green); }
    .move-caption {
      margin-top: 8px;
      font-size: 15px; font-weight: 500; color: #3f3f46;
    }
    .spark { margin-top: auto; height: 70px; }
    .spark svg { width: 100%; height: 100%; display: block; }

    /* —— Why card —— */
    .insight {
      position: relative;
      background: var(--card);
      border-radius: 24px;
      box-shadow: var(--shadow);
      padding: 22px 24px 24px;
      overflow: hidden;
      flex: 0 1 auto;
      min-height: 420px;
      max-height: 520px;
    }
    .insight-head {
      display: flex; align-items: center; gap: 12px;
      margin-bottom: 16px; position: relative; z-index: 1;
    }
    .bulb {
      width: 38px; height: 38px; border-radius: 50%;
      background: var(--orange); color: #fff;
      display: grid; place-items: center; flex-shrink: 0;
    }
    .bulb svg {
      width: 18px; height: 18px; stroke: #fff; fill: none;
      stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
    }
    .insight-title {
      font-size: 17px; font-weight: 700;
      letter-spacing: 0.9px; text-transform: uppercase; color: var(--ink);
    }
    .insight-body {
      position: relative; z-index: 1;
      max-width: 70%;
      display: flex; flex-direction: column; gap: 14px;
    }
    .insight-body p {
      font-size: 21px; font-weight: 400;
      line-height: 1.48; color: var(--ink);
    }
    .insight-body .hl { color: var(--orange-hl); font-weight: 600; }
    .globe {
      position: absolute;
      right: -36px; top: 52%;
      transform: translateY(-50%);
      width: 400px; height: 470px;
      object-fit: contain;
      pointer-events: none;
      opacity: 0.92;
      z-index: 0;
    }

    /* —— Metrics —— */
    .snapshot {
      background: var(--card);
      border-radius: 22px;
      box-shadow: var(--shadow);
      border: 1px solid #f0f0f0;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      padding: 18px 8px 20px;
      flex-shrink: 0;
      position: relative;
      z-index: 3;
    }
    .snap {
      padding: 2px 8px;
      border-right: 1px solid #eeeeee;
      text-align: center;
      display: flex; flex-direction: column; align-items: center; gap: 5px;
      min-width: 0;
    }
    .snap:last-child { border-right: 0; }
    .snap-ic {
      width: 34px; height: 34px; border-radius: 50%;
      display: grid; place-items: center;
    }
    .snap-ic.slate { background: #f5ebe3; color: #334155; }
    .snap-ic.orange { background: #fff1e8; color: #ea580c; }
    .snap-ic.gray { background: #f3f0ec; color: #374151; }
    .snap-ic.mint { background: #ecfdf5; color: #059669; }
    .snap-ic.indigo { background: #eef2ff; color: #6366f1; }
    .snap-label {
      font-size: 10px; font-weight: 600;
      letter-spacing: 0.07em; color: var(--muted);
      text-transform: uppercase; margin-top: 2px;
    }
    .snap-val { font-size: 15px; font-weight: 700; color: var(--ink); line-height: 1.2; }
    .snap-val.green { color: var(--green); font-size: 20px; }
    .snap-val.big { font-size: 20px; }
    .snap-sub { font-size: 10px; color: var(--muted-2); font-weight: 400; }
    .snap-eps {
      width: 100%;
      font-size: 10px; color: var(--muted);
      display: flex; flex-direction: column; gap: 4px;
      padding: 0 2px;
    }
    .snap-eps .row {
      display: flex; justify-content: space-between; align-items: baseline; gap: 4px;
      padding-bottom: 4px; border-bottom: 1px solid #f0f0f0;
    }
    .snap-eps .row:last-child { border-bottom: 0; padding-bottom: 0; }
    .snap-eps strong { color: var(--orange); font-size: 14px; font-weight: 700; }

    /* —— Platform footer —— */
    .footer-wrap {
      position: relative;
      flex-shrink: 0;
      margin-top: 2px;
      min-height: 148px;
    }
    .footer {
      height: 120px;
      margin-top: 12px;
      background: linear-gradient(90deg, #fff2f0 0%, #fffdfd 100%);
      border-radius: 22px;
      padding: 0 20px;
      padding-right: 200px;
      display: flex; align-items: center; gap: 12px;
      position: relative;
      z-index: 1;
    }
    .footer-brand { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    .footer-brand .brand-mark { width: 28px; height: 28px; }
    .footer-brand span {
      font-size: 18px; font-weight: 700; color: #0a0a0a;
      letter-spacing: -0.02em;
    }
    .footer-divider { width: 1px; height: 30px; background: #fdba8c; flex-shrink: 0; }
    .footer-cta {
      font-size: 16px; font-weight: 500; color: var(--ink);
      letter-spacing: -0.01em; line-height: 1.3; flex: 1;
    }
    .footer-cta strong { color: var(--orange); font-weight: 700; }

    .phone {
      position: absolute;
      right: 2px;
      bottom: -10px;
      width: 185px;
      height: auto;
      transform: rotate(-8deg);
      filter: drop-shadow(0 14px 22px rgba(0,0,0,0.18));
      z-index: 6;
      pointer-events: none;
      display: block;
    }
    .footer {
      height: 118px;
      margin-top: 10px;
      background: linear-gradient(90deg, #fff2f0 0%, #fffdfd 100%);
      border-radius: 22px;
      padding: 0 20px;
      padding-right: 190px;
      display: flex; align-items: center; gap: 12px;
      position: relative;
      z-index: 1;
    }
    .snap:last-child {
      border-right: 0;
      padding-right: 10px;
      z-index: 4;
    }
  </style>
</head>
<body>
  <div id="stage">
    <header class="header">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 70 90" aria-hidden="true">
          <path d="M10 15 L45 15 C60 15 65 25 65 35 C65 45 55 55 45 55 L25 55 L25 75 C25 80 20 85 15 85 C10 85 5 80 5 75 L5 15 Z" fill="#0A0A0A"/>
          <circle cx="45" cy="75" r="7" fill="#0A0A0A"/>
          <path d="M25 35 L45 35" stroke="#FFFFFF" stroke-width="8"/>
        </svg>
        <span class="brand-name">PocketEdge</span>
      </div>
      <div class="header-right">
        <div class="header-label">Daily Stock Summary</div>
        <div class="header-date">
          <svg class="cal" viewBox="0 0 22 20" fill="none">
            <rect x="0" y="3" width="22" height="17" rx="3" stroke="#E83828" stroke-width="2"/>
            <path d="M0 8 L22 8 M6 0 L6 5 M16 0 L16 5" stroke="#E83828" stroke-width="2" stroke-linecap="round"/>
            <circle cx="6" cy="13" r="1.5" fill="#E83828"/>
            <circle cx="11" cy="13" r="1.5" fill="#E83828"/>
            <circle cx="16" cy="13" r="1.5" fill="#E83828"/>
          </svg>
          <span id="display-date"></span>
        </div>
      </div>
    </header>

    <section class="hero">
      <div class="logo-card" id="company-logo"></div>
      <div class="identity">
        <div class="company-name" id="company-name"></div>
        <div class="sector-pill">
          <span class="ic">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 21h18"/><path d="M5 21V8l4 3V8l4 3V5l6 4v12"/></svg>
          </span>
          <span id="company-sector"></span>
        </div>
      </div>
      <div class="move-card" id="move-card">
        <div class="move-pct" id="move-pct"></div>
        <div class="move-caption" id="move-caption"></div>
        <div class="spark" id="sparkline"></div>
      </div>
    </section>

    <section class="insight">
      <div class="insight-head">
        <div class="bulb">
          <svg viewBox="0 0 24 24"><path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7V17h8v-2.3A7 7 0 0 0 12 2z"/></svg>
        </div>
        <div class="insight-title" id="insight-title"></div>
      </div>
      <div class="insight-body" id="insight-body"></div>
      <img class="globe" src="./assets/globe-exact.png" alt="" aria-hidden="true" />
    </section>

    <section class="snapshot" id="snapshot"></section>

    <div class="footer-wrap">
      <footer class="footer">
        <div class="footer-brand">
          <svg class="brand-mark" viewBox="0 0 70 90" aria-hidden="true">
            <path d="M10 15 L45 15 C60 15 65 25 65 35 C65 45 55 55 45 55 L25 55 L25 75 C25 80 20 85 15 85 C10 85 5 80 5 75 L5 15 Z" fill="#0A0A0A"/>
            <circle cx="45" cy="75" r="7" fill="#0A0A0A"/>
            <path d="M25 35 L45 35" stroke="#FFFFFF" stroke-width="8"/>
          </svg>
          <span>PocketEdge</span>
        </div>
        <div class="footer-divider"></div>
        <div class="footer-cta" id="footer-cta"></div>
      </footer>
      <img class="phone" src="./assets/phone-exact.png" alt="" aria-hidden="true" />
    </div>
  </div>

  <script id="card-data" type="application/json">{"ticker":"360ONE","company":{"name":"360ONE","ticker":"360ONE","logoText":"360ONE","logoUrl":null,"sector":"Equity"},"facts":{"epsCurrency":"INR","eps":[{"label":"Latest","value":"—"},{"label":"Prior","value":"—"}],"founded":"—","foundedSub":"","oneYearReturn":"—","oneYearReturnAsOf":"","marketCap":"—","marketCapSub":"(Approx.)"},"cta":{"line1":"Stay Updated on Your Portfolio","line2Prefix":"at","brand":"PocketEdge"},"asOfDate":"2026-07-17","displayDate":"17th July 2026","performance":{"changePct":2.05,"caption":"Rose on 17 Jul","sparkline":[1102,1085,1103.5]},"analysis":{"title":"Why Did It Rise?","paragraphs":["The strongest explanation appears to be the company’s Q1 FY27 results and outlook, showing robust AUM growth, double-digit revenue and profit expansion, and improving margins driven by wealth management strength. Investors likely welcomed higher recurring revenue, strong flows, and the UBS/B&K collaboration potential.","These positives underpin a favorable earnings trajectory and justify the share uptick. However, ongoing price movement may also reflect market positioning ahead of continued upbeat signals; none of the other items contradict this interpretation."],"highlights":[]},"metrics":[{"label":"Sector","icon":"building","tone":"slate","primary":"Equity"},{"label":"EPS (INR)","icon":"bars","tone":"orange","type":"eps","rows":[{"label":"Latest","value":"—"},{"label":"Prior","value":"—"}]},{"label":"Founded","icon":"calendar","tone":"gray","big":true,"primary":"—","secondary":""},{"label":"1Y Returns","icon":"trend","tone":"mint","primary":"—","secondary":""},{"label":"Market Cap","icon":"pie","tone":"indigo","big":true,"primary":"—","secondary":"(Approx.)"}]}</script>
  <script>
    const ICONS = {
      building: `<svg width="15" height="15" viewBox="-12 -12 24 24" fill="none" stroke="#334155" stroke-width="1.5" stroke-linecap="round"><path d="M-8 10 L-8 -2 L-2 -2 L-2 -10 L10 -10 L10 10"/><path d="M-4 4 L-4 6 M2 4 L2 6 M2 0 L2 2 M6 0 L6 2 M6 4 L6 6"/></svg>`,
      bars: `<svg width="15" height="15" viewBox="-12 -12 24 24"><rect x="-8" y="-2" width="4" height="12" rx="1" fill="#EA580C"/><rect x="-1" y="-8" width="4" height="18" rx="1" fill="#EA580C"/><rect x="6" y="2" width="4" height="8" rx="1" fill="#EA580C"/></svg>`,
      calendar: `<svg width="15" height="15" viewBox="-12 -12 24 24" fill="none" stroke="#374151" stroke-width="1.8"><rect x="-9" y="-8" width="18" height="18" rx="2"/><line x1="-9" y1="-2" x2="9" y2="-2"/><circle cx="-4" cy="3" r="1" fill="#374151" stroke="none"/><circle cx="0" cy="3" r="1" fill="#374151" stroke="none"/><circle cx="4" cy="3" r="1" fill="#374151" stroke="none"/><line x1="-5" y1="-12" x2="-5" y2="-7" stroke-linecap="round"/><line x1="5" y1="-12" x2="5" y2="-7" stroke-linecap="round"/></svg>`,
      trend: `<svg width="15" height="15" viewBox="-12 -12 24 24" fill="none" stroke="#059669" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M-9 8 L-3 1 L2 6 L10 -4"/><path d="M5 -4 L10 -4 L10 1"/></svg>`,
      pie: `<svg width="15" height="15" viewBox="-12 -12 24 24"><path d="M0 -10 A10 10 0 1 1 -10 0 L0 0 Z" fill="#6366F1"/><path d="M-2 -11 A11 11 0 0 0 -11 -2 L-2 -2 Z" fill="#A5B4FC"/></svg>`,
    };

    function escapeHtml(s) {
      return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
    }
    function highlightText(text, highlights) {
      let out = escapeHtml(text);
      (highlights || []).slice().sort((a,b)=>b.length-a.length).forEach(term => {
        const safe = escapeHtml(term);
        if (!safe) return;
        out = out.replace(new RegExp(safe.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"), "gi"), m => `<span class="hl">${m}</span>`);
      });
      return out;
    }
    function formatMovePct(n) {
      const v = Number(n);
      const abs = Math.abs(v).toFixed(2);
      return `${v < 0 ? "▼" : v > 0 ? "▲" : ""} ${abs}%`.trim();
    }
    function sparklineSvg(points, isUp) {
      const vals = (points || []).map(Number).filter(Number.isFinite);
      if (vals.length < 2) return "";
      const w = 210, h = 76, pad = 3;
      const min = Math.min(...vals), max = Math.max(...vals), span = max - min || 1;
      const coords = vals.map((v,i) => {
        const x = pad + (i/(vals.length-1))*(w-pad*2);
        const y = pad + (1-(v-min)/span)*(h-pad*2);
        return [x,y];
      });
      const d = coords.map((c,i)=> (i?`L ${c[0]} ${c[1]}`:`M ${c[0]} ${c[1]}`)).join(" ");
      const last = coords[coords.length-1];
      const color = isUp ? "#16a34a" : "#E11D2E";
      const area = `${d} L ${last[0]} ${h} L ${coords[0][0]} ${h} Z`;
      const uid = "sg" + Math.random().toString(36).slice(2,7);
      return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
        <defs><linearGradient id="${uid}" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="${color}" stop-opacity="0.3"/>
          <stop offset="100%" stop-color="${color}" stop-opacity="0"/>
        </linearGradient></defs>
        <path d="${area}" fill="url(#${uid})"/>
        <path d="${d}" fill="none" stroke="${color}" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="${last[0]}" cy="${last[1]}" r="4.2" fill="${color}"/>
      </svg>`;
    }

    function render(data) {
      document.getElementById("display-date").textContent = data.displayDate;
      const name = data.company.name || "";
      const parts = name.split(/\s+/);
      document.getElementById("company-name").innerHTML =
        parts.length > 1
          ? `<span>${escapeHtml(parts[0])}</span> <span class="thin">${escapeHtml(parts.slice(1).join(" "))}</span>`
          : escapeHtml(name);
      document.getElementById("company-sector").textContent = data.company.sector;

      const logoEl = document.getElementById("company-logo");
      const ticker = (data.company.ticker || data.ticker || "").toUpperCase();
      if (data.company.logoUrl) {
        logoEl.innerHTML = `<img src="${escapeHtml(data.company.logoUrl)}" alt="" />`;
      } else if (ticker === "ABB") {
        logoEl.innerHTML = `<img src="./assets/abb-logo.png" alt="ABB" />`;
      } else {
        const text = escapeHtml(data.company.logoText || ticker);
        const len = (data.company.logoText || ticker).length;
        const size = len <= 3 ? 48 : len <= 5 ? 34 : 24;
        logoEl.innerHTML = `<div style="font-size:${size}px;font-weight:800;color:#E10600;letter-spacing:-0.04em;text-align:center;line-height:1.05;max-width:100%;word-break:break-word">${text}</div>`;
      }

      const changePct = Number(data.performance.changePct);
      const isUp = changePct >= 0;
      document.getElementById("move-card").classList.toggle("is-up", isUp);
      document.getElementById("move-pct").textContent = formatMovePct(changePct);
      document.getElementById("move-caption").textContent = data.performance.caption;
      document.getElementById("sparkline").innerHTML = sparklineSvg(data.performance.sparkline, isUp);

      document.getElementById("insight-title").textContent = data.analysis.title;
      document.getElementById("insight-body").innerHTML = (data.analysis.paragraphs || [])
        .map(p => `<p>${highlightText(p, data.analysis.highlights)}</p>`).join("");

      const tones = ["slate","orange","gray","mint","indigo"];
      document.getElementById("snapshot").innerHTML = (data.metrics || []).map((m, i) => {
        const tone = m.tone || tones[i] || "slate";
        if (m.type === "eps") {
          const rows = (m.rows || []).map(r =>
            `<div class="row"><span>${escapeHtml(r.label)}</span><strong>${escapeHtml(r.value)}</strong></div>`
          ).join("");
          return `<div class="snap">
            <div class="snap-ic ${tone}">${ICONS[m.icon]||ICONS.bars}</div>
            <div class="snap-label">${escapeHtml(m.label)}</div>
            <div class="snap-eps">${rows}</div>
          </div>`;
        }
        const valClass = m.accent === "green" ? "snap-val green" : (m.big ? "snap-val big" : "snap-val");
        const primary = (m.primaryLines || [m.primary]).filter(Boolean).map(l=>`<div>${escapeHtml(l)}</div>`).join("");
        const secondary = m.secondary ? `<div class="snap-sub">${escapeHtml(m.secondary)}</div>` : "";
        return `<div class="snap">
          <div class="snap-ic ${tone}">${ICONS[m.icon]||ICONS.bars}</div>
          <div class="snap-label">${escapeHtml(m.label)}</div>
          <div class="${valClass}">${primary}</div>
          ${secondary}
        </div>`;
      }).join("");

      const cta = data.cta || {};
      const line1 = cta.line1 || "Stay Updated on Your Portfolio";
      const line2 = cta.line2Prefix ? `${cta.line2Prefix} ` : "at ";
      document.getElementById("footer-cta").innerHTML =
        `${escapeHtml(line1)}<br>${escapeHtml(line2)}<strong>${escapeHtml(cta.brand || "PocketEdge")}</strong>`;
    }

    render(JSON.parse(document.getElementById("card-data").textContent));
  </script>
</body>
</html>
