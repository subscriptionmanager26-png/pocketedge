    <style>
      html,
      body,
      #root {
        min-height: 100%;
        margin: 0;
      }
      body {
        background: #ffffff;
        color: #1a1a1a;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI',
          Roboto, 'Helvetica Neue', Arial, sans-serif;
      }
      .pe-boot {
        display: flex;
        min-height: 100dvh;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        padding: 24px;
        box-sizing: border-box;
      }
      .pe-boot__mark {
        width: 36px;
        height: 36px;
        border-radius: 10px;
        background: #ff6719;
      }
      .pe-boot__label {
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.02em;
        color: #8a8a8a;
      }
      .pe-boot__bar {
        width: 120px;
        height: 3px;
        overflow: hidden;
        border-radius: 999px;
        background: #f7f6f4;
      }
      .pe-boot__bar > span {
        display: block;
        width: 40%;
        height: 100%;
        border-radius: inherit;
        background: #ff6719;
        animation: pe-boot-slide 1.1s ease-in-out infinite;
      }
      @keyframes pe-boot-slide {
        0% {
          transform: translateX(-120%);
        }
        100% {
          transform: translateX(320%);
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="pe-boot" role="status" aria-live="polite" aria-label="Loading PocketEdge">
        <div class="pe-boot__mark" aria-hidden="true"></div>
        <div class="pe-boot__label">PocketEdge</div>
        <div class="pe-boot__bar" aria-hidden="true"><span></span></div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
